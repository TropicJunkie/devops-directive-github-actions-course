name: Cris Reusable

on: 
  workflow_call:
    inputs:
      color:
        description: "A selected color"
        type: string
        required: true

      texture:
        description: "A selected texture"
        required: true
        type: string

jobs:
  color-select:
    runs-on: ubuntu-22.04

    steps:
    - run: echo "Selected color ${{ inputs.color }}"
    - run: echo "Selected texture ${{ inputs.texture }}"
