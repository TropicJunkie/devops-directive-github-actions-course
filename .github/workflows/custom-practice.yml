name: Workflows, Jobs, and Steps

on: 
    workflow_dispatch:

jobs: 
  job-1:
    runs-on: ubuntu-latest
    steps: 
      - run: echo "something"
      - run: echo "something2"
  job-2: 
     runs-on: ubuntu-latest
     steps:
      - run: echo "something else"
      - run: echo "something else again"
      - run: echo "something else again again"

  job-3: 
     runs-on: ubuntu-latest
     needs: [job-1, job-2]
     steps:
        - run: echo "job 1 & 2 ran, hooray"
