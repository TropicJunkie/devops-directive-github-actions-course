name: Call a reusable workflow

on:
  workflow_dispatch: 

jobs:
  call-workflow:
    uses: TropicJunkie/devops-directive-github-actions-course/.github/workflows/workflow-A.yml@v1

  call-workflow-passing-data:
    permissions:
      contents: read
      pull-requests: write
    uses: octo-org/example-repo/.github/workflows/workflow-B.yml@main
    with:
      config-path: .github/labeler.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
